<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ftesë Dasme | Alban & Fiona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --pearl: #FDFBF7; /* E bardhë e ngrohtë / Perlë */
    --gold: #C5A059; /* Flori i butë klasik */
    --gold-light: #E8D399;
    --charcoal: #2C3539; /* Ngjyrë e errët për tekstin (jo plotësisht e zezë) */
    --glass-bg: rgba(255, 255, 255, 0.65);
    --glass-border: rgba(197, 160, 89, 0.3);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  
  body {
    background-color: var(--pearl);
    color: var(--charcoal);
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  body.locked { overflow: hidden; height: 100vh; }

  /* Sfondi me teksturë letre luksoze */
  body::before {
    content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
    opacity: 0.6; z-index: -1; pointer-events: none;
  }

  /* =========================================
     HYRJA MAGJIKE
  ========================================= */
  #intro-screen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: var(--pearl);
    background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
    z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  
  .monogram-btn {
    position: relative; width: 120px; height: 120px;
    border-radius: 50%; background: transparent;
    border: 2px solid var(--gold);
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; z-index: 10;
    animation: breathe 3s infinite;
  }
  .monogram-btn::before {
    content: 'A&F'; font-family: 'Great Vibes', cursive;
    font-size: 45px; color: var(--gold);
    text-shadow: 0 0 10px rgba(197, 160, 89, 0.5);
  }
  .intro-text {
    margin-top: 40px; font-family: 'Cinzel', serif; font-size: 12px;
    letter-spacing: 5px; color: var(--charcoal); text-transform: uppercase;
    animation: fadePulse 2s infinite;
  }

  .gold-ripple {
    position: fixed; top: 50%; left: 50%; width: 10px; height: 10px;
    background: #FFF; border-radius: 50%; transform: translate(-50%, -50%) scale(0);
    z-index: 10000; pointer-events: none; transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 1s ease;
    box-shadow: 0 0 50px 20px var(--gold-light);
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(197, 160, 89, 0.2); }
    50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(197, 160, 89, 0.5); }
  }
  @keyframes fadePulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* =========================================
     PLUHURI I ARTË VEROR (XIXAT)
  ========================================= */
  .magic-dust {
    position: fixed; bottom: -10px; z-index: 1;
    width: 4px; height: 4px; background: var(--gold-light);
    border-radius: 50%; box-shadow: 0 0 10px 2px var(--gold);
    opacity: 0; animation: floatUp linear infinite; pointer-events: none;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    20% { opacity: 0.6; }
    80% { opacity: 0.6; }
    100% { opacity: 0; transform: translateY(-110vh) scale(1.2); }
  }

  /* =========================================
     TRUPI I FTESËS (LIGHT GLASSMORPHISM)
  ========================================= */
  #main-content {
    opacity: 0; visibility: hidden; transition: opacity 1.5s ease;
    padding: 20px 20px 100px 20px; display: flex; flex-direction: column; align-items: center;
    position: relative; z-index: 5;
  }
  #main-content.show { opacity: 1; visibility: visible; }

  .glass-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: 1px solid var(--glass-border);
    border-radius: 20px; padding: 60px 30px;
    max-width: 600px; width: 100%; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.05);
    margin-top: 40px; position: relative; overflow: hidden;
  }

  .reveal { opacity: 0; transform: translateY(30px); transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .reveal.active { opacity: 1; transform: translateY(0); }

  /* Elementet e Tekstit */
  .quote {
    font-family: 'Cinzel', serif; font-size: 13px; line-height: 1.8;
    color: var(--charcoal); text-transform: uppercase; letter-spacing: 2px;
    margin-bottom: 40px; font-weight: 500;
  }
  
  .names-container { margin: 20px 0; }
  .name {
    font-family: 'Great Vibes', cursive; font-size: clamp(65px, 12vw, 90px);
    color: var(--gold); line-height: 0.9; text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
  }
  .surname {
    font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 4px;
    color: var(--charcoal); text-transform: uppercase; margin-top: 5px; font-weight: 600;
  }
  .and-symbol {
    font-family: 'Great Vibes', cursive; font-size: 45px; color: var(--charcoal);
    margin: 15px 0;
  }

  .divider {
    width: 80px; height: 1px; background: var(--gold);
    margin: 40px auto; opacity: 0.5;
  }

  /* Detajet e Eventit */
  .date-highlight {
    font-family: 'Cinzel', serif; font-size: 24px; color: var(--gold);
    letter-spacing: 2px; margin-bottom: 15px; font-weight: 600;
  }
  .location {
    font-family: 'Playfair Display', serif; font-size: 20px; color: var(--charcoal);
    margin-bottom: 40px; font-style: italic;
  }

  /* Timeline / Agjenda */
  .timeline-box {
    background: rgba(197, 160, 89, 0.05); border: 1px dashed var(--glass-border);
    border-radius: 10px; padding: 30px 20px; margin-bottom: 40px;
  }
  .time-item { margin-bottom: 20px; }
  .time-item:last-child { margin-bottom: 0; }
  .t-label { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: var(--charcoal); font-weight: 500; }
  .t-value { font-family: 'Cinzel', serif; font-size: 22px; color: var(--gold); margin-top: 5px; font-weight: 600;}

  /* Butoni i Hartës (PËR TË VENDOSUR LINKUN TËND) */
  .map-btn {
    display: inline-block; padding: 18px 50px; border-radius: 30px;
    background: var(--gold); border: none;
    color: #FFF; text-decoration: none; font-family: 'Cinzel', serif;
    font-size: 13px; letter-spacing: 3px; transition: 0.4s; text-transform: uppercase;
    box-shadow: 0 10px 20px rgba(197, 160, 89, 0.3); font-weight: 600;
  }
  .map-btn:hover { background: var(--charcoal); box-shadow: 0 10px 20px rgba(44, 53, 57, 0.3); color: var(--gold); }

  /* Mbyllja */
  .outro {
    font-family: 'Great Vibes', cursive; font-size: 40px; color: var(--charcoal);
    margin-top: 40px;
  }
  .family-name {
    font-family: 'Cinzel', serif; font-size: 16px; color: var(--gold);
    letter-spacing: 4px; text-transform: uppercase; margin-top: 10px;
  }

  /* Butoni i Muzikës */
  #music-toggle{
    position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%;
    background: var(--pearl); border: 1px solid var(--gold); color: var(--gold); font-size: 24px; 
    cursor: pointer; z-index: 50; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1); transition: 0.3s;
  }
  #music-toggle:hover { background: var(--gold); color: #FFF; }
  .spin { animation: spinRecord 4s linear infinite; }
  @keyframes spinRecord { 100% { transform: rotate(360deg); } }

</style>
</head>
<body class="locked">

<!-- Efekti Shpërthyes -->
<div class="gold-ripple" id="ripple"></div>

<!-- Hyrja -->
<div id="intro-screen">
  <div class="monogram-btn" id="start-btn"></div>
  <div class="intro-text">Zbuloni Magjinë Verore</div>
</div>

<!-- Muzika -->
<audio id="bg-audio" loop src="muzika.mp3"></audio>
<button id="music-toggle" aria-label="Luaj muzikën">♪</button>

<div id="main-content">
  
  <div class="glass-panel" style="margin-top: 60px;">
    
    <div class="quote reveal">
      Nën magjinë e një nate verore<br>
      duam ta festojmë së bashku me ju<br>
      fillimin e jetës tonë të re
    </div>

    <div class="divider reveal"></div>

    <div class="names-container reveal">
      <div class="name">Alban</div>
      <div class="surname">Bafkjari</div>
    </div>
    
    <div class="and-symbol reveal">&</div>
    
    <div class="names-container reveal">
      <div class="name">Fiona</div>
      <div class="surname">Shala</div>
    </div>

    <div class="divider reveal"></div>

    <div class="date-highlight reveal">Më 24 Korrik 2026</div>
    <div class="location reveal">Restaurant "Oktagon" - Tenovë</div>

    <div class="timeline-box reveal">
      <div class="time-item">
        <div class="t-label">Pritja e mysafirëve</div>
        <div class="t-value">19:00 - 20:30</div>
      </div>
      <div class="time-item" style="margin-top: 30px;">
        <div class="t-label">Darka në ora</div>
        <div class="t-value">23:00</div>
      </div>
    </div>
    
    <!-- === KETU VENDOS LINKUN E HARTES === -->
    <!-- Zëvendëso # me linkun e Google Maps brenda thonjëzave -->
    <div class="reveal">
      <a href="#" target="_blank" class="map-btn">Shiko Lokacionin në Hartë</a>
    </div>

    <div class="outro reveal">Me respekt</div>
    <div class="family-name reveal">Familja Bafkjari</div>

  </div>

</div>

<script>
  // Krijimi i xixave / pluhurit të artë
  function createMagicDust() {
    const num = window.innerWidth < 600 ? 25 : 45; 
    for(let i=0; i<num; i++) {
      let dust = document.createElement('div');
      dust.className = 'magic-dust';
      dust.style.left = Math.random() * 100 + 'vw';
      dust.style.animationDuration = (Math.random() * 5 + 5) + 's';
      dust.style.animationDelay = (Math.random() * 4) + 's';
      document.body.appendChild(dust);
    }
  }

  const startBtn = document.getElementById('start-btn');
  const introScreen = document.getElementById('intro-screen');
  const ripple = document.getElementById('ripple');
  const mainContent = document.getElementById('main-content');
  const audio = document.getElementById('bg-audio');
  const musicBtn = document.getElementById('music-toggle');
  let playing = false;

  startBtn.addEventListener('click', () => {
    // Shpërthimi i lehtë si dritë
    ripple.style.transform = 'translate(-50%, -50%) scale(400)';
    
    setTimeout(() => {
      introScreen.style.display = 'none';
      document.body.classList.remove('locked');
      ripple.style.opacity = '0';
      mainContent.classList.add('show');
      
      createMagicDust();
      checkReveal();
      
      if(audio.src && audio.getAttribute('src') !== "") {
        audio.play().then(() => {
          playing = true;
          musicBtn.innerHTML = '❚❚'; 
          musicBtn.classList.add('spin');
        }).catch(err => console.log(err));
      }
    }, 1000); 
  });

  musicBtn.addEventListener('click', () => {
    if(!audio.src || audio.getAttribute('src') === ""){
      musicBtn.innerHTML = '✕'; return; 
    }
    if(playing){ 
      audio.pause(); musicBtn.innerHTML = '♪'; musicBtn.classList.remove('spin');
    } else { 
      audio.play(); musicBtn.innerHTML = '❚❚'; musicBtn.classList.add('spin');
    }
    playing = !playing;
  });

  // Animacioni në Scroll
  function checkReveal() {
    var reveals = document.querySelectorAll('.reveal');
    for (var i = 0; i < reveals.length; i++) {
      var windowHeight = window.innerHeight;
      var elementTop = reveals[i].getBoundingClientRect().top;
      var elementVisible = 80; 
      
      if (elementTop < windowHeight - elementVisible) {
        reveals[i].classList.add('active');
      }
    }
  }
  window.addEventListener('scroll', checkReveal);
</script>

</body>
</html>
