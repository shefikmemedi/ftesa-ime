<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ftesa Digjitale — Krijoni ftesën tuaj unike</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF5EC;
    --wine:#4f5a3c;
    --gold:#B08D57;
    --charcoal:#2E2A26;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ivory);
    color: var(--charcoal);
    font-family: 'Cormorant Garamond', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
  }
  .logo {
    font-family: 'Tenor Sans', sans-serif;
    letter-spacing: 8px;
    font-size: 14px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  h1 {
    font-size: clamp(40px, 8vw, 70px);
    color: var(--wine);
    margin-bottom: 20px;
    font-weight: 400;
  }
  p {
    font-size: 22px;
    max-width: 600px;
    margin-bottom: 40px;
    line-height: 1.6;
    color: var(--charcoal);
  }
  .btn {
    display: inline-block;
    padding: 16px 36px;
    background: var(--wine);
    color: var(--ivory);
    text-decoration: none;
    font-family: 'Tenor Sans', sans-serif;
    letter-spacing: 3px;
    font-size: 13px;
    text-transform: uppercase;
    transition: 0.3s;
    border: 1px solid var(--wine);
  }
  .btn:hover {
    background: transparent;
    color: var(--wine);
  }
</style>
</head>
<body>

  <div class="logo">Studio e Dizajnit</div>
  
  <h1>Ftesa Digjitale</h1>
  
  <p>Zëvendësoni ftesat tradicionale të letrës me një eksperiencë digjitale, moderne dhe unike. Dërgoni ftesën tuaj kudo në botë me vetëm një klikim.</p>
  
  <!-- Ky buton i dërgon vizitorët te folderi yt për të parë ftesën si shembull -->
  <a href="/shefik-nusja" class="btn">Shiko Ftesën Demo</a>

</body>
</html>
